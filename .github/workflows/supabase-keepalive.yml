name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days, well inside Supabase's 7-day free-tier inactivity window
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        run: |
          # Print the project ref so the log shows which project was pinged
          # (the full secret is masked, but this substring is not)
          project_ref=$(echo "${{ secrets.SUPABASE_URL }}" | sed -E 's#https://([^.]+)\..*#\1#')
          echo "Pinging Supabase project: $project_ref"

          # Hit a real table so Postgres runs a query (counts as database activity).
          # RLS hides rows from anon, so the expected body is [].
          http_code=$(curl -s -o response.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with $http_code: $(cat response.txt)"
          if [ "$http_code" != "200" ]; then
            echo "Unexpected response code from Supabase"
            exit 1
          fi
