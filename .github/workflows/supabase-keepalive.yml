name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days, well inside Supabase's 7-day free-tier inactivity window
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase REST endpoint responded with $http_code"
          # 200/404 both mean the gateway is up and reachable; anything else, fail loudly
          if [ "$http_code" != "200" ] && [ "$http_code" != "404" ]; then
            echo "Unexpected response code from Supabase"
            exit 1
          fi
