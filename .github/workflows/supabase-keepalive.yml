name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days, well inside Supabase's 7-day free-tier inactivity window
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase auth endpoint
        run: |
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/settings" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase auth endpoint responded with $http_code"
          if [ "$http_code" != "200" ]; then
            echo "Unexpected response code from Supabase"
            exit 1
          fi
